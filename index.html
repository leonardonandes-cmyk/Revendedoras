<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo · Coleção 26/27</title>
<meta name="description" content="Catálogo de calçados femininos — papetes, salto bloco, rasteiras, sapatilhas e mocassins.">
<link rel="canonical" href="https://catalogo-revenda.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Catálogo">
<meta property="og:title" content="Catálogo · Coleção 26/27">
<meta property="og:description" content="Papetes, salto bloco, rasteiras, sapatilhas e mocassins. Conheça a coleção.">
<meta property="og:url" content="https://catalogo-revenda.vercel.app/">
<meta property="og:image" content="https://raw.githubusercontent.com/leonardonandes-cmyk/Revendedoras/main/capa-revenda.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Catálogo · Coleção 26/27">
<meta name="twitter:description" content="Papetes, salto bloco, rasteiras, sapatilhas e mocassins. Conheça a coleção.">
<meta name="twitter:image" content="https://raw.githubusercontent.com/leonardonandes-cmyk/Revendedoras/main/capa-revenda.jpg">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preload" as="image" fetchpriority="high" href="https://raw.githubusercontent.com/leonardonandes-cmyk/Imagens-Cat-logo-/main/banner-home.jfif">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Serif+Display&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fbfaf6;--ink:#3a4030;--soft:#5f5c4c;--line:#dcdac9;--champagne:#6b7355;--studio:#e6e4d7;--card:#fff}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;line-height:1.5}

  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .wordmark{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;letter-spacing:.42em;padding-left:.42em;color:#000;white-space:nowrap;text-decoration:none}
  nav{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:none;position:relative;padding:4px 0;white-space:nowrap;transition:color .3s}
  nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--champagne);transition:width .35s}
  nav a:hover{color:var(--ink)} nav a:hover::after{width:100%}
  nav a.menu-sale{color:#c1272d} nav a.menu-sale:hover{color:#7a1f1f} nav a.menu-sale::after{background:#c1272d}

  .hero{position:relative;height:82vh;max-height:760px;min-height:480px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .hero-pic{position:absolute;inset:0}
  .hero-pic img{width:100%;height:100%;object-fit:cover;object-position:center 16%;animation:kb 22s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,26,23,.14),rgba(28,26,23,.4))}
  .hero-inner{position:relative;z-index:2;text-align:center;color:#fff;padding:0 24px}
  .hero-eyebrow{font-size:11px;letter-spacing:.36em;text-transform:uppercase;margin-bottom:22px;opacity:0;animation:rise .9s .1s forwards}
  .hero h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(44px,9vw,86px);letter-spacing:.46em;padding-left:.46em;line-height:1;opacity:0;animation:rise .9s .25s forwards}
  .hero-sub{margin-top:20px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:0;animation:rise .9s .4s forwards}
  .hero-cta{display:inline-block;margin-top:32px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.6);padding:13px 30px;transition:background .35s,color .35s;opacity:0;animation:rise .9s .55s forwards}
  .hero-cta:hover{background:#fff;color:var(--ink)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .manifesto{padding:78px 24px 60px;text-align:center;border-bottom:1px solid var(--line)}
  .manifesto-in{max-width:740px;margin:0 auto}
  .manifesto .risco{display:block;width:54px;height:1px;background:var(--champagne);margin:0 auto 30px}
  .manifesto p{font-family:'Cormorant Garamond',serif;font-weight:500;
               font-size:clamp(27px,4.6vw,44px);line-height:1.24;color:var(--ink)}
  @media(max-width:640px){.manifesto{padding:58px 24px 46px}}

  .campanhas{max-width:1180px;margin:0 auto;padding:56px 24px 54px;position:relative}
  .camp-viewport{position:relative}
  .camp-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .camp-track::-webkit-scrollbar{display:none}
  .card.camp-card{flex:0 0 38%;scroll-snap-align:start;opacity:1;transform:none}
  .camp-card .frame{aspect-ratio:4/5;cursor:default}
  .camp-arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--ink);font-family:'Jost',sans-serif;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 4px 16px rgba(20,18,16,.12);transition:opacity .3s,background .3s;opacity:0}
  .camp-viewport:hover .camp-arrow{opacity:1}
  .camp-arrow:hover{background:#fff}
  .camp-arrow.prev{left:-10px}
  .camp-arrow.next{right:-10px}
  .camp-arrow:disabled{opacity:0!important;pointer-events:none}
  @media(max-width:1040px){.card.camp-card{flex-basis:46%}}
  @media(max-width:720px){
    .campanhas{padding:44px 24px 42px}
    .camp-track{gap:12px}
    .card.camp-card{flex-basis:84%}
    .camp-arrow{display:none}
  }

  .collection{max-width:1180px;margin:0 auto;padding:56px 24px 8px}
  .col-head{margin-bottom:30px;max-width:560px}
  .col-eyebrow{font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--champagne);margin-bottom:10px}
  .col-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:32px;letter-spacing:.03em}
  .col-desc{margin-top:12px;color:var(--ink);font-size:14px;line-height:1.6;font-weight:600}
  .rule{height:1px;background:var(--line);position:relative;margin-top:20px;overflow:hidden}
  .rule::after{content:"";position:absolute;left:0;top:0;height:100%;width:0;background:var(--champagne);transition:width 1.1s cubic-bezier(.16,.8,.3,1)}
  .rule.in::after{width:120px}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:44px}
  @media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:26px}}
  @media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr);gap:28px}}

  .card{background:var(--card);opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s;display:block}
  .card.in{opacity:1;transform:none}
  .frame{position:relative;overflow:hidden;background:var(--studio);aspect-ratio:4/5;display:block;text-decoration:none;box-shadow:0 8px 20px rgba(58,64,48,.16)}
  .frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.4s cubic-bezier(.16,.8,.3,1),opacity .25s}
  .card:hover .frame img{transform:scale(1.06)}
  .tag{position:absolute;top:12px;left:12px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--champagne);background:rgba(254,253,251,.92);padding:5px 10px;z-index:3}
  .dl{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(254,253,251,.9);color:var(--ink);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.9;transition:opacity .3s,background .3s,transform .2s;z-index:4;user-select:none}
  .dl:hover{opacity:1;background:#fff;transform:translateY(-1px)}
  .buy{position:absolute;left:0;right:0;bottom:0;background:rgba(28,26,23,.9);color:#fff;text-align:center;padding:12px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;transform:translateY(100%);transition:transform .4s;z-index:3}
  .card:hover .buy{transform:translateY(0)}
  .meta{padding:16px 4px 8px;text-align:center}
  .name{font-size:12.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
  .price{margin-top:7px;font-size:15px;font-weight:400;color:#2a2622}
  .swatches{display:flex;gap:7px;justify-content:center;margin-top:11px;flex-wrap:wrap}
  .dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.14);cursor:pointer;transition:transform .2s,box-shadow .2s}
  .dot:hover{transform:scale(1.15)}
  .dot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--champagne)}
  .cor-nome{margin-top:8px;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);min-height:14px}

  .vazio{padding:26px 4px 48px;color:var(--soft);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  .ofertas{background:#efe1d8;max-width:none;padding-left:0;padding-right:0}
  .ofertas-in{max-width:1180px;margin:0 auto;padding:18px 24px 50px}
  .ofertas .col-eyebrow{color:#c1272d}
  .ofertas .col-title{color:#c1272d;font-size:clamp(46px,8vw,60px);line-height:1;letter-spacing:.04em}
  .ofertas .col-desc{color:#c1272d;font-weight:500}
  .ofertas .rule::after{background:#c1272d}
  .tag-oferta{color:#fff!important;background:#c1272d!important}
  .price.sale{color:#c1272d;font-weight:700}
  .price-de{color:#a99f8e;text-decoration:line-through;font-weight:400;font-size:.82em;margin-right:8px}

  /* ---- Faixa SALE: "SALE" grande e legível, vermelho vivo ---- */
  .zsale{display:block;position:relative;overflow:hidden;background:#c1272d;height:clamp(120px,17vw,168px);margin:0}
  .zsale-word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
              font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:#fff;
              font-size:clamp(74px,13vw,140px);line-height:1;letter-spacing:.05em;white-space:nowrap;user-select:none;pointer-events:none}
  @media(max-width:640px){
    .zsale{height:clamp(104px,26vw,132px)}
    .zsale-word{font-size:clamp(64px,17vw,112px)}
  }

  /* ---- Botões 3D ---- */
  .btn{display:block;width:100%;max-width:430px;margin:0 auto;padding:17px 22px;text-align:center;
       font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
       text-decoration:none;border-radius:3px;cursor:pointer;
       transition:transform .12s ease,box-shadow .12s ease,background .35s ease,color .35s ease}
  .btn:active{transform:translateY(5px);box-shadow:0 0 0 rgba(0,0,0,0)!important}
  .btn-rev{background:#fff;color:#141210;box-shadow:0 5px 0 #a99f8e}
  .btn-rev:hover{background:#25d366;color:#fff;box-shadow:0 5px 0 #199c4b}
  .btn-ig{color:#fff;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);box-shadow:0 5px 0 #8d1263}
  .btn-ig:hover{filter:brightness(1.08)}
  .btn-cluff{background:#152532;color:#f8efd0;box-shadow:0 5px 0 #08111a}
  .btn-cluff:hover{background:#1d3346}

  .reseller{max-width:1180px;margin:26px auto 0;padding:0 24px}
  .reseller-inner{background:var(--ink);color:#fff;text-align:center;padding:62px 24px 58px}
  .reseller-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--champagne);margin-bottom:16px}
  .reseller h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,4.6vw,44px);line-height:1.15}
  .reseller .frase{font-family:'Cormorant Garamond',serif;font-weight:500;
       font-size:clamp(24px,3.8vw,36px);line-height:1.25;color:#fff;margin-bottom:14px}
  .reseller h3{opacity:.92}
  .reseller p{max-width:520px;margin:18px auto 30px;font-size:14.5px;line-height:1.65;color:#e6e0d6}
  .reseller .nota{margin-top:20px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--champagne)}

  footer{border-top:1px solid var(--line);margin-top:44px;padding:48px 24px 56px;text-align:center}
  .foot-mark{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;letter-spacing:.4em;padding-left:.4em;margin-bottom:16px;color:#000}
  .foot-line{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
  .conecta{max-width:1180px;margin:0 auto;padding:56px 24px 8px;text-align:center}
  .conecta .rot{font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--champagne);margin-bottom:16px}
  .conecta .gap{height:34px}
  .conecta .sub{max-width:430px;margin:10px auto 0;font-size:12.5px;color:var(--soft);line-height:1.6}

  /* ---- Ficha do produto (toque no card): foto, cores e medidas — sem marca e sem preço ---- */
  .card[data-nome]:not(.camp-card) .frame{cursor:pointer}
  .ver-ficha{margin-top:9px;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--champagne);cursor:pointer;background:none;border:0;font-family:inherit}
  .fundo{position:fixed;inset:0;background:rgba(30,32,24,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
  .fundo.on{opacity:1;pointer-events:auto}
  .ficha{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--bg);border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;
         padding:14px 22px 26px;transform:translateY(105%);transition:transform .35s cubic-bezier(.16,.8,.3,1);box-shadow:0 -10px 40px rgba(30,32,24,.25)}
  .ficha.on{transform:none}
  .ficha .alca{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
  .ficha .fechar{position:absolute;top:8px;right:12px;width:38px;height:38px;border:0;background:transparent;font-size:26px;color:var(--ink);cursor:pointer}
  .ficha .fpic{background:var(--studio);aspect-ratio:4/5;max-height:46vh;margin:0 auto;overflow:hidden}
  .ficha .fpic img{width:100%;height:100%;object-fit:cover;display:block}
  .ficha .fnome{margin-top:16px;font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-align:center}
  .ficha .ffrase{margin-top:6px;font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.3;text-align:center;color:var(--soft)}
  .ficha .fcores{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0 4px}
  .ficha .fcores .dot{width:22px;height:22px}
  .ficha .fcornome{text-align:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);min-height:16px;margin-bottom:14px}
  .ficha .ftec{border-top:1px solid var(--line);margin:4px 0 18px}
  .ficha .ftec h4{font-size:10.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--champagne);margin:16px 0 4px}
  .ficha .fl{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .ficha .fl span{color:var(--soft);letter-spacing:.04em}
  .ficha .fl b{font-weight:500;text-align:right}
  .ficha .fmed{padding:10px 0 6px;border-bottom:1px solid var(--line)}
  .ficha .fmed-t{font-size:11px;letter-spacing:.06em;color:var(--soft);margin-bottom:8px}
  .ficha .fmed-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:6px}
  .ficha .fmed-g div{border:1px solid var(--line);border-radius:4px;text-align:center;padding:5px 2px;background:#fff}
  .ficha .fmed-g span{display:block;font-size:10.5px;color:var(--soft)}
  .ficha .fmed-g b{display:block;font-size:13px;font-weight:600}
  .ficha .facoes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ficha .facoes button{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:14px 8px;
         border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;border-radius:3px}
  .ficha .facoes button.pri{background:var(--ink);color:#fff}
  .aviso{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:12px;letter-spacing:.08em;
         padding:12px 18px;border-radius:3px;z-index:95;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  .aviso.on{opacity:1;transform:translate(-50%,0)}
  body.travado{overflow:hidden}
  @media(min-width:720px){
    .ficha{left:50%;right:auto;bottom:auto;top:50%;width:460px;border-radius:6px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s}
    .ficha.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
    .ficha .alca{display:none}
  }
  .status{max-width:1180px;margin:0 auto;padding:48px 24px;text-align:center;color:var(--soft);font-size:13px;letter-spacing:.1em}
  @media(max-width:640px){
    .bar{flex-direction:column;gap:14px}
    nav{gap:18px;width:100%}
    nav a{font-size:11px;letter-spacing:.1em}
    .collection{padding-top:44px}
    .hero{height:88vh;min-height:540px;max-height:none}
    .hero-pic img{object-position:center 28%}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .card{opacity:1;transform:none}.rule::after{width:120px}
    .hero-eyebrow,.hero h1,.hero-sub,.hero-cta{opacity:1}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="wordmark" href="#top">CATÁLOGO</a>
    <nav id="menu"></nav>
  </div>
</header>

<section class="hero" id="top">
  <picture class="hero-pic"><img id="heroImg" alt="Coleção" fetchpriority="high" decoding="async"></picture>
  <div class="hero-inner">
    <div class="hero-eyebrow" id="heroEyebrow">Verão 26/27</div>
    <h1>COLEÇÃO</h1>
    <div class="hero-sub">Calçados Femininos</div>
    <a class="hero-cta" href="#conteudo">Ver Coleção</a>
  </div>
</section>

<div id="conteudo">
  <div class="status" id="status">Carregando o catálogo…</div>
</div>

<div class="fundo" id="fundo"></div>
<div class="ficha" id="ficha" role="dialog" aria-modal="true" aria-label="Ficha do produto">
  <div class="alca"></div>
  <button class="fechar" id="fFechar" aria-label="Fechar">&times;</button>
  <div class="fpic"><img id="fImg" alt=""></div>
  <div class="fnome" id="fNome"></div>
  <div class="ffrase" id="fFrase"></div>
  <div class="fcores" id="fCores"></div>
  <div class="fcornome" id="fCorNome"></div>
  <div class="ftec" id="fTec"></div>
  <div class="facoes">
    <button id="fBaixar">Baixar foto</button>
    <button class="pri" id="fCopiar">Copiar descrição</button>
  </div>
</div>
<div class="aviso" id="aviso"></div>

<footer>
  <div class="foot-line">Coleção · Verão 26/27</div>
</footer>

<script>
/* ============================================================
   CONFIGURAÇÃO — os únicos valores que talvez você precise mexer
   ============================================================ */
const PLANILHA_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdb6qFDgmJRe_Rgqcm4K9a6OmXZ97sajYApbnYJyMWbrB3IjnkHkLtE1GLedOQkEFoaOuTqWfKNEgH/pub?gid=1734594426&single=true&output=csv";
const FICHAS_CSV   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdb6qFDgmJRe_Rgqcm4K9a6OmXZ97sajYApbnYJyMWbrB3IjnkHkLtE1GLedOQkEFoaOuTqWfKNEgH/pub?gid=1433975832&single=true&output=csv";   // aba FICHAS (medidas)
const REPO_REVENDA = "https://raw.githubusercontent.com/leonardonandes-cmyk/Revendedoras/main/";
const REPO_FOTOS   = "https://raw.githubusercontent.com/leonardonandes-cmyk/Imagens-Cat-logo-/main/";
const REPO_SITE    = "https://raw.githubusercontent.com/leonardonandes-cmyk/DBAESSE-catalogo/main/";
const EXTENSAO     = ".jpeg";

/* Menu vem da aba "Menu" da MESMA planilha do DBAESSE (col A, uma categoria por linha).

const $ = s => document.querySelector(s);
const slug = s => (s||"").toString().trim().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"-");
const cap = s => (s||"").toString().trim().replace(/\s+/g," ");

function parseCSV(text){
  const rows=[]; let row=[], val="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){val+='"';i++;} else q=false; }
      else val+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(val); val=""; }
      else if(c==='\n'){ row.push(val); rows.push(row); row=[]; val=""; }
      else if(c!=='\r') val+=c;
    }
  }
  row.push(val); rows.push(row);
  return rows.filter(r=>r.some(v=>(v||"").trim()!==""));
}

function mistura(hex,f,alvo){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(alvo-r)*f); g=Math.round(g+(alvo-g)*f); b=Math.round(b+(alvo-b)*f);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function corHex(nome){
  const k=slug(nome);
  if(CORES[k]) return CORES[k];
  const claro =/(^|-)(bb|bebe|baby|claro|clara|pastel)(-|$)/.test(k);
  const escuro=/(^|-)(escuro|escura)(-|$)/.test(k);
  const base=k.replace(/(^|-)(bb|bebe|baby|claro|clara|pastel|escuro|escura)(-|$)/g,"-")
              .replace(/^-+|-+$/g,"");
  let hex=CORES[base];
  if(!hex) for(const key in CORES) if(base.includes(key)||k.includes(key)){hex=CORES[key];break;}
  if(!hex) hex="#c4bcae";
  if(claro)  hex=mistura(hex,.58,255);
  if(escuro) hex=mistura(hex,.35,0);
  return hex;
}

const REPOS=[REPO_REVENDA,REPO_FOTOS,REPO_SITE];
const EXTS=[".jpeg",".jpg",".jfif",".JPEG",".JPG",".JFIF",".png",".PNG",".webp"];
function urlsRef(ref){
  const enc=encodeURI((ref||"").trim());
  if(!enc) return [];
  const out=[];
  // extensão comum primeiro, nos DOIS repositórios — evita dezenas de 404 até achar a foto
  EXTS.forEach(e=>REPOS.forEach(r=>out.push(r+enc+e)));
  return out;
}
function fotoUrls(row, idx){
  return urlsRef((row[idx.ref]||"").trim());
}
function setHero(ref){
  const lista=urlsRef(ref||"banner-home");
  if(!lista.length) return;
  const h=$("#heroImg");
  h.dataset.lista=encodeURIComponent(JSON.stringify(lista));
  h.dataset.i="0";
  h.onerror=function(){ proximaFoto(this); };
  h.src=lista[0];
}
function proximaFoto(img){
  try{
    const lista=JSON.parse(decodeURIComponent(img.dataset.lista||"[]"));
    let i=parseInt(img.dataset.i||"0",10)+1;
    if(i<lista.length){ img.dataset.i=String(i); img.src=lista[i]; }
    else { img.onerror=null; img.removeAttribute("alt"); img.style.opacity=".25"; }
  }catch(e){ img.onerror=null; }
}
function trocaFoto(img,listaEnc){
  img.dataset.lista=listaEnc; img.dataset.i="0";
  try{ img.src=JSON.parse(decodeURIComponent(listaEnc))[0]; }catch(e){}
}

function precoFmt(v){
  const s=(v||"").toString().trim();
  if(!s) return "";
  if(s.toUpperCase().indexOf("R$")===0) return s;
  const n=parseFloat(s.replace(/\./g,"").replace(",","."));
  if(isNaN(n)) return s;
  return "R$ " + n.toFixed(2).replace(".",",");
}

function cardHTML(p){
  const cores = p.cores;
  const first = cores[0];
  const dots = cores.map((c,i)=>
    `<span class="dot${i===0?" on":""}" data-lista="${c.lista}" data-cor="${c.cor}" style="background:${corHex(c.cor)}" title="${c.cor}"></span>`
  ).join("");
  return `<div class="card" data-nome="${p.nome}">
    <div class="frame">
      <img src="${first.fotos[0]}" data-lista="${first.lista}" data-i="0" onerror="proximaFoto(this)" alt="${p.nome}" loading="lazy" decoding="async">
    </div>
    <div class="meta">
      <div class="name">${p.nome}</div>
      ${cores.length>1?`<div class="swatches">${dots}</div>`:""}
      <div class="cor-nome">${cores.length>1?first.cor:""}</div>
      <button class="ver-ficha" type="button">Ver medidas</button>
    </div>
  </div>`;
}

function secaoHTML(id, eyebrow, titulo, desc, produtos, extraClass){
  const cards = produtos.length
      ? `<div class="grid">${produtos.map(cardHTML).join("")}</div>`
      : `<div class="vazio">Novidades em breve</div>`;
  const inner = `<div class="col-head">
      <div class="col-eyebrow">${eyebrow}</div>
      ${titulo?`<div class="col-title">${titulo}</div>`:""}
      ${desc?`<div class="col-desc">${desc}</div>`:""}
      <div class="rule"></div>
    </div>
    ${cards}`;
  if(extraClass==="ofertas")
    return `<section class="collection ofertas" id="${id}"><div class="ofertas-in">${inner}</div></section>`;
  return `<section class="collection" id="${id}">${inner}</section>`;
}

async function baixar(src,nome){
  try{
    const r=await fetch(src); const b=await r.blob();
    const u=URL.createObjectURL(b);
    const a=document.createElement("a"); a.href=u; a.download=nome.replace(/\s+/g,"-")+EXTENSAO;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
  }catch(e){ window.open(src,"_blank"); }
}

function ativar(){
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}})},{threshold:.12});
  document.querySelectorAll(".card").forEach((c,i)=>{c.style.transitionDelay=(i%4*70)+"ms";io.observe(c);});
  document.querySelectorAll(".rule").forEach(r=>io.observe(r));
  // Pré-carrega as cores de cada card pouco antes de aparecer,
  // pra que trocar de cor seja instantâneo (sem baixar na hora do clique).
  function preloadCores(card){
    card.querySelectorAll(".dot").forEach(d=>{
      let lista;
      try{ lista=JSON.parse(decodeURIComponent(d.dataset.lista||"[]")); }catch(e){ return; }
      (function tenta(i){
        if(i>=lista.length) return;
        const im=new Image();
        im.onerror=function(){ tenta(i+1); };
        im.src=lista[i];
      })(0);
    });
  }
  const pio=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){preloadCores(e.target);pio.unobserve(e.target);}})},{rootMargin:"300px"});
  document.querySelectorAll(".card").forEach(c=>pio.observe(c));

  document.querySelectorAll(".card").forEach(card=>{
    const img=card.querySelector(".frame img");
    const nome=card.dataset.nome||"produto";
    const corNome=card.querySelector(".cor-nome");
    card.querySelectorAll(".dot").forEach(d=>{
      d.addEventListener("click",e=>{
        e.preventDefault(); e.stopPropagation();
        img.style.opacity=0;
        setTimeout(()=>{img.onerror=function(){proximaFoto(this)};trocaFoto(img,d.dataset.lista);img.style.opacity=1;},140);
        card.querySelectorAll(".dot").forEach(x=>x.classList.remove("on"));
        d.classList.add("on");
        if(corNome) corNome.textContent=d.dataset.cor;
      });
    });
    const abre=e=>{ e.preventDefault(); abrirFicha(nome, corNome&&corNome.textContent); };
    card.querySelector(".frame").addEventListener("click",abre);
    const vf=card.querySelector(".ver-ficha"); if(vf) vf.addEventListener("click",abre);
    const b=document.createElement("span");
    b.className="dl"; b.title="Baixar foto"; b.textContent="\u2193";
    b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();baixar(img.currentSrc||img.src,nome+"-"+((corNome&&corNome.textContent)||""));});
    card.querySelector(".frame").appendChild(b);
  });

  initCampCarousel();
}

/* ============ FICHA DO PRODUTO (aba FICHAS da planilha) ============ */
const FICHAS={modelo:{},cat:{}}, PRODS={};
const CAMPOS_FICHA=[{k:"cabedal",t:"Cabedal"},{k:"solado",t:"Solado"},{k:"salto",t:"Salto"},{k:"forma",t:"Forma"},{k:"numeracao",t:"Numeração"},{k:"peso",t:"Peso com caixa"},{k:"caixa",t:"Caixa"},{k:"medidas",t:"Medidas"}];
/* MEDIDAS (coluna J da aba FICHAS): "34=22,5; 35=23; 36=23,5" → tabela da palmilha por número */
function medidasLista(v){
  const pares=String(v||"").split(/[;\/\n]|,(?=\s*\d{2}\s*[=:])/).map(x=>x.match(/^\s*(\d{2})\s*[=:]\s*([\d.,]+)\s*(cm)?\s*$/i)).filter(Boolean);
  return pares.length>=2 ? pares.map(m=>({n:m[1], cm:m[2].replace(".",",")})) : null;
}
function medidasHTML(v){
  const l=medidasLista(v);
  if(!l) return `<div class="fl"><span>Medidas</span><b>${v}</b></div>`;
  return `<div class="fmed"><div class="fmed-t">Tabela de medidas · palmilha (cm)</div><div class="fmed-g">`+
    l.map(x=>`<div><span>${x.n}</span><b>${x.cm}</b></div>`).join("")+`</div></div>`;
}
function medidasTexto(v){
  const l=medidasLista(v);
  return l ? "Tabela de medidas (palmilha): "+l.map(x=>x.n+" = "+x.cm+" cm").join(" · ") : "Medidas: "+v;
}
function pesoFmt(v){                       // número pequeno = kg (0,4 → 0,4 kg); grande = g (400 → 400 g)
  if(!/^[\d.,]+$/.test(v)) return v;
  const n=parseFloat(v.replace(",",".")); if(isNaN(n)) return v;
  return v+(n<20?" kg":" g");
}
function fichaDe(p){
  const f=Object.assign({},FICHAS.cat[slug(p.cat)]||{},FICHAS.modelo[slug(p.nome)]||{});
  if(f.peso) f.peso=pesoFmt(f.peso);
  if(f.caixa && !/cm/i.test(f.caixa)) f.caixa+=" cm";
  return f;
}
async function carregaFichas(){
  try{
    const t=await (await fetch(FICHAS_CSV+"&t="+Date.now())).text();
    const rows=parseCSV(t); if(rows.length<2) return;
    const h=rows[0].map(x=>slug(x)), col=k=>h.findIndex(x=>x.startsWith(k));
    const ci={nome:col("nome"),cat:col("categoria")}; CAMPOS_FICHA.forEach(c=>ci[c.k]=col(c.k));
    rows.slice(1).forEach(r=>{
      const nome=cap(r[ci.nome]), cat=cap(r[ci.cat]), f={};
      CAMPOS_FICHA.forEach(c=>{ const v=ci[c.k]>=0?cap(r[ci[c.k]]):""; if(v) f[c.k]=v; });
      if(!Object.keys(f).length) return;
      if(nome) FICHAS.modelo[slug(nome)]=Object.assign(FICHAS.modelo[slug(nome)]||{},f);
      else if(cat) FICHAS.cat[slug(cat)]=Object.assign(FICHAS.cat[slug(cat)]||{},f);
    });
  }catch(e){ /* sem fichas: catálogo segue normal */ }
}
let FAT=null, FCOR=0;
function aviso(t){ const a=$("#aviso"); a.textContent=t; a.classList.add("on"); clearTimeout(a._t); a._t=setTimeout(()=>a.classList.remove("on"),2200); }
function mostraCorFicha(i){
  const c=FAT.cores[i]; FCOR=i;
  const img=$("#fImg"); img.onerror=function(){proximaFoto(this)}; trocaFoto(img,c.lista); img.alt=FAT.nome+" "+c.cor;
  $("#fCorNome").textContent=FAT.cores.length>1?c.cor:"";
  document.querySelectorAll("#fCores .dot").forEach((d,k)=>d.classList.toggle("on",k===i));
}
function abrirFicha(nome, corAtual){
  const p=PRODS[slug(nome)]; if(!p) return; FAT=p;
  $("#fNome").textContent=p.nome;
  $("#fFrase").textContent=FRASES_CAT[slug(p.cat)]||"";
  $("#fCores").innerHTML=p.cores.length>1?p.cores.map((c,k)=>`<span class="dot" data-k="${k}" style="background:${corHex(c.cor)}" title="${c.cor}"></span>`).join(""):"";
  document.querySelectorAll("#fCores .dot").forEach(d=>d.addEventListener("click",()=>mostraCorFicha(+d.dataset.k)));
  const ini=Math.max(0,p.cores.findIndex(c=>c.cor===corAtual)); mostraCorFicha(ini);
  const f=fichaDe(p), linhas=CAMPOS_FICHA.filter(c=>f[c.k]).map(c=>c.k==="medidas" ? medidasHTML(f[c.k]) : `<div class="fl"><span>${c.t}</span><b>${f[c.k]}</b></div>`).join("");
  $("#fTec").innerHTML=`<h4>Ficha técnica</h4>`+(linhas||`<div class="fl"><span>Medidas em breve</span><b></b></div>`);
  $("#fundo").classList.add("on"); $("#ficha").classList.add("on"); document.body.classList.add("travado"); $("#ficha").scrollTop=0;
}
function fecharFicha(){ $("#fundo").classList.remove("on"); $("#ficha").classList.remove("on"); document.body.classList.remove("travado"); }
function descricao(p){                      // sem marca e sem cidade: a revendedora usa como dela
  const linhas=[p.nome]; const fr=FRASES_CAT[slug(p.cat)]; if(fr) linhas.push(fr); linhas.push("");
  if(p.cat) linhas.push("Categoria: "+p.cat);
  linhas.push("Cores disponíveis: "+p.cores.map(c=>c.cor).join(", "));
  const f=fichaDe(p); CAMPOS_FICHA.forEach(c=>{ if(f[c.k]) linhas.push(c.k==="medidas" ? medidasTexto(f[c.k]) : c.t+": "+f[c.k]); });
  linhas.push("Calçado feminino.");
  return linhas.join("\n");
}
(function(){
  $("#fundo").addEventListener("click",fecharFicha); $("#fFechar").addEventListener("click",fecharFicha);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") fecharFicha(); });
  $("#fCopiar").addEventListener("click",async()=>{ if(!FAT) return; const t=descricao(FAT);
    try{ await navigator.clipboard.writeText(t); aviso("Descrição copiada"); }
    catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); aviso("Descrição copiada");}catch(_){aviso("Não foi possível copiar");} ta.remove(); } });
  $("#fBaixar").addEventListener("click",()=>{ if(!FAT) return; const img=$("#fImg"); baixar(img.currentSrc||img.src, FAT.nome+"-"+FAT.cores[FCOR].cor); });
})();

function initCampCarousel(){
  const vp=document.querySelector(".camp-viewport");
  if(!vp) return;
  const track=vp.querySelector(".camp-track");
  const prev=vp.querySelector(".camp-arrow.prev");
  const next=vp.querySelector(".camp-arrow.next");
  if(!track||!prev||!next) return;
  function passo(){
    const card=track.querySelector(".camp-card");
    const gap=parseFloat(getComputedStyle(track).gap)||18;
    return card ? card.getBoundingClientRect().width+gap : track.clientWidth*.8;
  }
  function atualiza(){
    const max=track.scrollWidth-track.clientWidth-2;
    prev.disabled=track.scrollLeft<=2;
    next.disabled=track.scrollLeft>=max;
  }
  function avanca(){
    const max=track.scrollWidth-track.clientWidth-2;
    if(track.scrollLeft>=max) track.scrollTo({left:0,behavior:"smooth"});   // volta ao início suave
    else track.scrollBy({left:passo(),behavior:"smooth"});
  }

  /* ---- Movimento automático (só se houver mais fotos do que cabem) ---- */
  const reduz=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const podeAuto=()=>!reduz && track.scrollWidth>track.clientWidth+4;
  let timer=null, idle=null;
  function toca(){ if(podeAuto() && !timer) timer=setInterval(avanca,4000); }
  function para(){ if(timer){ clearInterval(timer); timer=null; } }
  function reinicia(){ para(); toca(); }

  prev.addEventListener("click",()=>{ track.scrollBy({left:-passo(),behavior:"smooth"}); reinicia(); });
  next.addEventListener("click",()=>{ avanca(); reinicia(); });
  track.addEventListener("scroll",atualiza,{passive:true});
  window.addEventListener("resize",atualiza);
  vp.addEventListener("mouseenter",para);                                   // pausa ao passar o mouse
  vp.addEventListener("mouseleave",toca);
  vp.addEventListener("touchstart",()=>{ para(); clearTimeout(idle); },{passive:true});
  vp.addEventListener("touchend",()=>{ clearTimeout(idle); idle=setTimeout(toca,5000); },{passive:true});

  atualiza();
  toca();
}

async function montar(){
  let txt;
  try{
    const r=await fetch(PLANILHA_CSV+"&t="+Date.now());
    txt=await r.text();
  }catch(e){
    $("#status").textContent="Não foi possível carregar o catálogo agora. Tente novamente em instantes.";
    return;
  }
  const rows=parseCSV(txt);
  if(rows.length<2){ $("#status").textContent="A planilha ainda não tem produtos."; return; }

  // Ordem do menu vem da aba "Menu" (coluna A, uma categoria por linha) — a MESMA do DBAESSE. Se falhar, mantém ORDEM_PADRAO.
  try{
    const rm=await fetch(MENU_CSV+"&t="+Date.now());
    const tm=await rm.text();
    const linhas=parseCSV(tm).map(l=>(l[0]||"").trim()).filter(x=>x);
    if(linhas.length && ["menu","categoria","categorias","ordem"].includes(slug(linhas[0]))) linhas.shift();
    if(linhas.length) ORDEM_MENU=linhas;
  }catch(e){ /* mantém ORDEM_PADRAO */ }

  const head=rows[0].map(h=>slug(h));
  const idx={
    cat:  head.findIndex(h=>h.startsWith("categoria")),
    nome: head.findIndex(h=>h.startsWith("nome")),
    cor:  head.findIndex(h=>h.startsWith("cor")),
    preco:head.findIndex(h=>h.startsWith("preco")),
    tag:  head.findIndex(h=>h.startsWith("tag")),
    of:   head.findIndex(h=>h.startsWith("oferta")),
    de:   head.findIndex(h=>h==="de" || h.startsWith("de-") || h.startsWith("de ") || h.startsWith("preco-de") || h.startsWith("precocheio")),
    ref:  head.findIndex(h=>h.startsWith("referencia")),
    link: head.findIndex(h=>h.startsWith("link"))
  };

  const mapa={};
  const ordem=[];
  const campanhas=[];
  let bannerRef="";
  let bannerRevRef="";
  let teaserTxt="";

  const ehOfertaCat = s => (s==="oferta"||s==="ofertas"||s==="sale");

  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const cat=cap(r[idx.cat]), nome=cap(r[idx.nome]);
    const ref=(r[idx.ref]||"").trim();

    if(slug(cat)==="teasersale" || slug(cat)==="faixasale" || slug(cat)==="teaser"){ if(nome) teaserTxt=nome; continue; }
    if(!ref) continue;

    if(slug(cat)==="bannerrevenda" || slug(cat)==="banner-revenda"){ bannerRevRef=ref; continue; } // banner exclusivo da revenda
    if(slug(cat)==="banner" || slug(nome)==="banner"){ bannerRef=ref; continue; }
    if(slug(cat)==="campanha" || slug(cat)==="campanhas"){ continue; }   // campanhas da marca NÃO entram no revenda
    if(slug(cat)==="campanharevenda" || slug(cat)==="campanha-revenda"){ // campanhas EXCLUSIVAS da revenda
      const fs=fotoUrls(r,idx);
      if(fs.length) campanhas.push({nome:cap(nome)||"Campanha",fotos:fs,
                                    lista:encodeURIComponent(JSON.stringify(fs))});
      continue;
    }
    if(!nome) continue;

    // Um modelo (referência) = um produto, agrupado só pelo NOME.
    // Cada COR carrega seu próprio preço e sua própria marca de oferta,
    // pra o mesmo modelo poder aparecer na categoria (cores de preço cheio)
    // E em SALE (cores em promoção) ao mesmo tempo.
    const chave=slug(nome);
    if(!mapa[chave]){
      mapa[chave]={cat:"",nome:nome,tag:cap(r[idx.tag]),precoBase:"",cores:[]};
      ordem.push(chave);
    }
    const p=mapa[chave];

    const catEhOferta=ehOfertaCat(slug(cat));
    if(!catEhOferta && cat && !p.cat) p.cat=cat;       // categoria real do modelo
    if(!p.tag && cap(r[idx.tag])) p.tag=cap(r[idx.tag]);

    const precoLinha=precoFmt(r[idx.preco]);
    if(!p.precoBase && precoLinha) p.precoBase=precoLinha;

    const deLinha=(idx.de>=0)?precoFmt(r[idx.de]):"";

    const fotos=fotoUrls(r,idx);
    if(fotos.length) p.cores.push({
      cor:cap(r[idx.cor])||"Único",
      fotos:fotos,
      lista:encodeURIComponent(JSON.stringify(fotos)),
      oferta: false,
      preco: precoLinha,
      de: deLinha
    });
  }

  const produtos=ordem.map(k=>mapa[k]).filter(p=>p.cores.length);
  produtos.forEach(p=>PRODS[slug(p.nome)]=p);
  await carregaFichas();
  if(!produtos.length){ $("#status").textContent="A planilha ainda não tem produtos com foto."; return; }

  if(bannerRevRef){ setHero(bannerRevRef); } else if(bannerRef){ setHero(bannerRef); }

  let htmlCamp="", menuCamp="";
  if(campanhas.length){
    menuCamp=`<a href="#campanhas">Campanhas</a>`;
    const cards=campanhas.map(c=>`
      <div class="card camp-card" data-nome="${c.nome}">
        <div class="frame">
          <img src="${c.fotos[0]}" data-lista="${c.lista}" data-i="0"
               onerror="proximaFoto(this)" alt="${c.nome}" loading="lazy" decoding="async">
        </div>
      </div>`).join("");
    htmlCamp=`<section class="campanhas" id="campanhas">
      <div class="col-head">
        <div class="col-eyebrow">Editorial</div>
        <div class="col-title">Campanhas</div>
        <div class="rule"></div>
      </div>
      <div class="camp-viewport">
        <button class="camp-arrow prev" aria-label="Anterior">&#8249;</button>
        <div class="camp-track">${cards}</div>
        <button class="camp-arrow next" aria-label="Próximo">&#8250;</button>
      </div>
    </section>`;
  }

  // Monta um "card" a partir de um subconjunto de cores do modelo.
  // O preço mostrado é o da primeira cor daquele contexto (categoria ou SALE),
  // caindo pro preço base do modelo se a cor não tiver preço próprio.
  function montaCard(p, cores, isSale){
    const precoCtx=(cores.find(c=>c.preco)||{}).preco || p.precoBase || "";
    const deCtx=(cores.find(c=>c.de)||{}).de || "";
    return {nome:p.nome, preco:precoCtx, de:deCtx, tag:isSale?"":p.tag, oferta:isSale, cores:cores};
  }

  let html="", menu="";
  const usadas=new Set();

  const norm=(s)=>slug(s).replace(/s+$/,"");   // tolera singular/plural: lançamento = Lançamentos
  function secaoCat(nomeCat, frase){
    const id=slug(nomeCat);
    const key=norm(nomeCat);
    if(usadas.has(key)) return;
    usadas.add(key);
    const lista=produtos
      .filter(p=>norm(p.cat)===key)
      .map(p=>montaCard(p, p.cores.filter(c=>!c.oferta), false))  // só cores de preço cheio
      .filter(c=>c.cores.length);
    if(!lista.length) return;                 // categoria sem produto não entra no menu
    menu+=`<a href="#${id}">${nomeCat}</a>`;
    html+=secaoHTML(id,"Linha",nomeCat,frase||"",lista);
  }

  // 1) na ordem definida pela aba Menu (frase vem de FRASES_CAT)
  ORDEM_MENU.forEach(nomeCat=>{
    if(ehOfertaCat(slug(nomeCat))) return;
    secaoCat(nomeCat, FRASES_CAT[slug(nomeCat)]||"");
  });
  // 2) categorias com produto que não estão na aba Menu — entram no fim, sem sumir
  produtos.forEach(p=>{
    if(!p.cat || ehOfertaCat(slug(p.cat))) return;
    secaoCat(p.cat, FRASES_CAT[slug(p.cat)]||"");
  });

  $("#menu").innerHTML=menuCamp+menu;
  $("#conteudo").innerHTML=htmlCamp+html;
  ativar();
}

setHero("banner-home");
montar();
</script>
</body>
</html>
